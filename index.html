<!doctype html>
<html lang="en">
  <head>
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>📝 Todo List</h1>
    <div id="todo-input-container">
      <input type="text" id="todo-input" placeholder="new todo" />
      <button id="todo-add">add</button>
    </div>
    <section id="todos">
      <div id="todo-item-template">
        <div id="" class="todo-item">
          <div>
            <input data-id="" type="checkbox" />
            <p class="todo-title">todo 1</p>
          </div>
          <button data-id="" class="delete-todo">❌</button>
        </div>
      </div>
      <div id="todo-item-template">
        <div id="" class="todo-item">
          <div>
            <input data-id="" type="checkbox" />
            <p class="todo-title">todo 2</p>
          </div>
          <button data-id="" class="delete-todo">❌</button>
        </div>
      </div>
    </section>
  </body>

</html>
